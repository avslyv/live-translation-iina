version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: pytest
      - dependency-name: ruff
      - dependency-name: pyright
    groups:
      development:
        patterns: ["pytest", "ruff", "pyright"]
