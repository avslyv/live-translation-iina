name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            .github/requirements-ci.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt -r .github/requirements-ci.txt
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m pyright
      - name: Check shell syntax
        run: bash -n setup.sh install-app.sh setup-iina.sh installer/bootstrap.sh

  python:
    name: Python ${{ matrix.python }} unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            .github/requirements-ci.txt
      - name: Install audio import dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt -r .github/requirements-ci.txt
      - name: Test without models or an audio device
        run: python -m pytest -q

  plugin:
    name: IINA plugin contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Check plugin syntax
        run: node --check iina-plugin/main.js
      - name: Test native subtitle lifecycle and seek buffering
        run: node --test tests/test_plugin_autostart.js

  installer:
    name: macOS installer frontend
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build native frontend
        run: xcrun swiftc -target arm64-apple-macosx14.0 -framework Cocoa installer/Installer.swift -o /tmp/live-translation-installer
      - name: Test progress transport and cancellation
        run: /tmp/live-translation-installer --self-test
