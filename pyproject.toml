[project]
name = "live-translation"
version = "1.3.0"
description = "Local translation for native IINA subtitles and macOS system audio."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"live_translate_overlay.py" = ["B007", "B023", "SIM102", "SIM105", "SIM108"]

[tool.pyright]
pythonVersion = "3.12"
include = ["live_translation", "live_translate_overlay.py", "iina_bridge.py", "installer", "tools", "tests"]
reportAttributeAccessIssue = false
reportMissingImports = false
reportMissingModuleSource = false
reportSelfClsParameterName = false
